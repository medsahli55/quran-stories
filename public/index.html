<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قصص القرآن — Stories of the Quran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Naskh+Arabic:wght@400;600&family=Literata:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1B2D;
    --ink-deep:#0A141F;
    --parchment:#F3E9D2;
    --parchment-dim:#e9dcc0;
    --gold:#C9A24B;
    --gold-bright:#E0BE6E;
    --teal:#1B4B4A;
    --rose:#8B3A3A;
    --ivory:#EDE6D6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, #16263c 0%, var(--ink) 45%, var(--ink-deep) 100%);
    color:var(--ivory);
    font-family:'Literata', 'Noto Naskh Arabic', serif;
    min-height:100vh;
  }
  [lang-ar] { font-family:'Noto Naskh Arabic', serif; }

  header{
    text-align:center;
    padding:48px 20px 32px;
    border-bottom:1px solid rgba(201,162,75,0.25);
  }
  header h1{
    font-family:'Amiri', serif;
    font-size:2.6rem;
    margin:0;
    color:var(--gold-bright);
    letter-spacing:0.5px;
  }
  header .subtitle{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    color:var(--ivory);
    opacity:0.75;
    font-size:1.15rem;
    margin-top:6px;
  }
  .lang-toggle{
    margin-top:18px;
    display:inline-flex;
    border:1px solid var(--gold);
    border-radius:999px;
    overflow:hidden;
  }
  .lang-toggle button{
    background:transparent;
    color:var(--ivory);
    border:none;
    padding:8px 22px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.8rem;
    letter-spacing:1px;
    cursor:pointer;
    transition:background 0.2s;
  }
  .lang-toggle button.active{
    background:var(--gold);
    color:var(--ink-deep);
    font-weight:600;
  }

  .layout{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:0;
    max-width:1200px;
    margin:0 auto;
    min-height:70vh;
  }
  @media (max-width:760px){
    .layout{grid-template-columns:1fr;}
  }

  /* ---- Silsila (the timeline thread) ---- */
  .silsila{
