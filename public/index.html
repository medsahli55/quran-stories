<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قصص القرآن — Stories of the Quran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Naskh+Arabic:wght@400;600&family=Literata:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1B2D;
    --ink-deep:#0A141F;
    --parchment:#F3E9D2;
    --parchment-dim:#e9dcc0;
    --gold:#C9A24B;
    --gold-bright:#E0BE6E;
    --teal:#1B4B4A;
    --rose:#8B3A3A;
    --ivory:#EDE6D6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, #16263c 0%, var(--ink) 45%, var(--ink-deep) 100%);
    color:var(--ivory);
    font-family:'Literata', 'Noto Naskh Arabic', serif;
    min-height:100vh;
  }
  [lang-ar] { font-family:'Noto Naskh Arabic', serif; }

  header{
    text-align:center;
    padding:48px 20px 32px;
    border-bottom:1px solid rgba(201,162,75,0.25);
  }
  header h1{
    font-family:'Amiri', serif;
    font-size:2.6rem;
    margin:0;
    color:var(--gold-bright);
    letter-spacing:0.5px;
  }
  header .subtitle{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    color:var(--ivory);
    opacity:0.75;
    font-size:1.15rem;
    margin-top:6px;
  }
  .lang-toggle{
    margin-top:18px;
    display:inline-flex;
    border:1px solid var(--gold);
    border-radius:999px;
    overflow:hidden;
  }
  .lang-toggle button{
    background:transparent;
    color:var(--ivory);
    border:none;
    padding:8px 22px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.8rem;
    letter-spacing:1px;
    cursor:pointer;
    transition:background 0.2s;
  }
  .lang-toggle button.active{
    background:var(--gold);
    color:var(--ink-deep);
    font-weight:600;
  }

  .layout{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:0;
    max-width:1200px;
    margin:0 auto;
    min-height:70vh;
  }
  @media (max-width:760px){
    .layout{grid-template-columns:1fr;}
  }

  /* ---- Silsila (the timeline thread) ---- */
  .silsila{
    position:relative;
    padding:48px 30px;
  }
  .silsila::before{
    content:"";
    position:absolute;
    top:48px; bottom:48px;
    right:59px;
    width:2px;
    background:linear-gradient(var(--gold), var(--gold) 80%, transparent);
    opacity:0.6;
  }
  .prophet-node{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 0;
    cursor:pointer;
    flex-direction:row-reverse;
  }
  .prophet-node .dot{
    width:14px; height:14px;
    border-radius:50%;
    background:var(--ink);
    border:2px solid var(--gold);
    flex-shrink:0;
    z-index:1;
    transition:all 0.25s;
  }
  .prophet-node.active .dot{
    background:var(--gold-bright);
    box-shadow:0 0 12px var(--gold-bright);
  }
  .prophet-node .names{
    text-align:right;
  }
  .prophet-node .name-ar{
    font-family:'Amiri', serif;
    font-size:1.15rem;
    color:var(--ivory);
    display:block;
  }
  .prophet-node .name-en{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:0.85rem;
    color:var(--gold);
    display:block;
    opacity:0.8;
  }
  .prophet-node.active .name-ar{ color:var(--gold-bright); }

  /* ---- Story panel ---- */
  .story-panel{
    padding:48px 40px;
    border-right:1px solid rgba(201,162,75,0.15);
  }
  .story-card{
    background:var(--parchment);
    color:var(--ink-deep);
    border-radius:6px;
    padding:36px 40px;
    position:relative;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }
  .story-card::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid var(--gold);
    border-radius:3px;
    pointer-events:none;
  }
  .story-card h2{
    font-family:'Amiri', serif;
    font-size:1.9rem;
    margin:0 0 4px;
    color:var(--teal);
  }
