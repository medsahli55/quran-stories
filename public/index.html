
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قصص القرآن — Stories of the Quran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Naskh+Arabic:wght@400;600&family=Literata:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1B2D;
    --ink-deep:#0A141F;
    --parchment:#F3E9D2;
    --parchment-dim:#e9dcc0;
    --gold:#C9A24B;
    --gold-bright:#E0BE6E;
    --teal:#1B4B4A;
    --rose:#8B3A3A;
    --ivory:#EDE6D6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, #16263c 0%, var(--ink) 45%, var(--ink-deep) 100%);
    color:var(--ivory);
    font-family:'Literata', 'Noto Naskh Arabic', serif;
    min-height:100vh;
  }
  [lang-ar] { font-family:'Noto Naskh Arabic', serif; }

  header{
    text-align:center;
    padding:48px 20px 32px;
    border-bottom:1px solid rgba(201,162,75,0.25);
  }
  header h1{
    font-family:'Amiri', serif;
    font-size:2.6rem;
    margin:0;
    color:var(--gold-bright);
    letter-spacing:0.5px;
  }
  header .subtitle{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    color:var(--ivory);
    opacity:0.75;
    font-size:1.15rem;
    margin-top:6px;
  }
  .lang-toggle{
    margin-top:18px;
    display:inline-flex;
    border:1px solid var(--gold);
    border-radius:999px;
    overflow:hidden;
  }
  .lang-toggle button{
    background:transparent;
    color:var(--ivory);
    border:none;
    padding:8px 22px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.8rem;
    letter-spacing:1px;
    cursor:pointer;
    transition:background 0.2s;
  }
  .lang-toggle button.active{
    background:var(--gold);
    color:var(--ink-deep);
    font-weight:600;
  }

  .layout{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:0;
    max-width:1200px;
    margin:0 auto;
    min-height:70vh;
  }
  @media (max-width:760px){
    .layout{grid-template-columns:1fr;}
  }

  /* ---- Silsila (the timeline thread) ---- */
  .silsila{
    position:relative;
    padding:48px 30px;
  }
  .silsila::before{
    content:"";
    position:absolute;
    top:48px; bottom:48px;
    right:59px;
    width:2px;
    background:linear-gradient(var(--gold), var(--gold) 80%, transparent);
    opacity:0.6;
  }
  .prophet-node{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 0;
    cursor:pointer;
    flex-direction:row-reverse;
  }
  .prophet-node .dot{
    width:14px; height:14px;
    border-radius:50%;
    background:var(--ink);
    border:2px solid var(--gold);
    flex-shrink:0;
    z-index:1;
    transition:all 0.25s;
  }
  .prophet-node.active .dot{
    background:var(--gold-bright);
    box-shadow:0 0 12px var(--gold-bright);
  }
  .prophet-node .names{
    text-align:right;
  }
  .prophet-node .name-ar{
    font-family:'Amiri', serif;
    font-size:1.15rem;
    color:var(--ivory);
    display:block;
  }
  .prophet-node .name-en{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:0.85rem;
    color:var(--gold);
    display:block;
    opacity:0.8;
  }
  .prophet-node.active .name-ar{ color:var(--gold-bright); }

  /* ---- Story panel ---- */
  .story-panel{
    padding:48px 40px;
    border-right:1px solid rgba(201,162,75,0.15);
  }
  .story-card{
    background:var(--parchment);
    color:var(--ink-deep);
    border-radius:6px;
    padding:36px 40px;
    position:relative;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }
  .story-card::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid var(--gold);
    border-radius:3px;
    pointer-events:none;
  }
  .story-card h2{
    font-family:'Amiri', serif;
    font-size:1.9rem;
    margin:0 0 4px;
    color:var(--teal);
  }
  .story-card .title-en{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    color:var(--rose);
    font-size:1.1rem;
    margin-bottom:22px;
    display:block;
  }
  .story-card p{
    line-height:1.9;
    font-size:1.05rem;
  }
  .empty-state{
    color:var(--ivory);
    opacity:0.6;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.3rem;
    text-align:center;
    margin-top:100px;
  }

  .section-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    letter-spacing:2px;
    color:var(--gold);
    text-transform:uppercase;
    margin:34px 0 12px;
    display:block;
  }

  .verse{
    background:rgba(27,75,74,0.08);
    border-right:3px solid var(--teal);
    padding:16px 20px;
    margin-bottom:14px;
    border-radius:4px;
  }
  .verse .ref{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.75rem;
    color:var(--teal);
    display:block;
    margin-bottom:6px;
  }
  .verse .ar{
    font-family:'Amiri', serif;
    font-size:1.3rem;
    line-height:2;
    display:block;
    margin-bottom:6px;
  }
  .verse .en{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1rem;
    opacity:0.8;
  }

  /* ---- Quiz ---- */
  .quiz-box{
    background:rgba(139,58,58,0.08);
    border:1px solid var(--rose);
    border-radius:6px;
    padding:22px 26px;
    margin-top:18px;
  }
  .quiz-box .q{
    font-weight:600;
    margin-bottom:14px;
    font-size:1.05rem;
  }
  .choice{
    display:block;
    width:100%;
    text-align:right;
    background:var(--parchment-dim);
    border:1px solid rgba(139,58,58,0.3);
    color:var(--ink-deep);
    padding:10px 16px;
    margin-bottom:8px;
    border-radius:4px;
    cursor:pointer;
    font-family:inherit;
    font-size:0.95rem;
    transition:all 0.2s;
  }
  .choice:hover{ background:#e0d2ab; }
  .choice.correct{ background:#c8dcb8; border-color:#5a7a3a; }
  .choice.wrong{ background:#e0b8b8; border-color:var(--rose); }
  .quiz-explain{
    margin-top:12px;
    font-style:italic;
    font-size:0.9rem;
    color:var(--teal);
    display:none;
  }
</style>
</head>
<body>

<header>
  <h1 id="app-title">قصص القرآن</h1>
  <div class="subtitle" id="app-subtitle">Stories of the Quran, from Adam to the Seal of the Prophets</div>
  <div class="lang-toggle">
    <button id="btn-ar" class="active" onclick="setLang('ar')">ع</button>
    <button id="btn-en" onclick="setLang('en')">EN</button>
  </div>
</header>

<div class="layout">
  <nav class="silsila" id="silsila">
    <!-- prophet nodes injected here -->
  </nav>

  <main class="story-panel" id="story-panel">
    <div class="empty-state" id="empty-state">اختر نبياً من السلسلة لتبدأ القصة<br><span style="font-size:0.9rem">Choose a prophet from the timeline to begin</span></div>
  </main>
</div>

<!-- Supabase client -->
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  // ---- Fill these in with your own Supabase project values ----
  const SUPABASE_URL = 'https://ozqmwrjwjyqdtbpawbxw.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_gy-Wwpc_gkQJYPSDXpPrfg_HFxhaB8r';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let lang = 'ar';
  let prophets = [];
  let activeProphetId = null;

  window.setLang = function(l){
    lang = l;
    document.getElementById('btn-ar').classList.toggle('active', l==='ar');
    document.getElementById('btn-en').classList.toggle('active', l==='en');
    document.body.setAttribute('dir', l==='ar' ? 'rtl' : 'ltr');
    renderSilsila();
    if(activeProphetId) loadProphetStories(activeProphetId);
  };

  async function loadProphets(){
    const { data, error } = await supabase
      .from('prophets')
      .select('*')
      .order('era_order', { ascending:true });
    if(error){ console.error('loadProphets error:', error); return; }
    prophets = data;
    renderSilsila();
  }

  function renderSilsila(){
    const el = document.getElementById('silsila');
    el.innerHTML = '';
    prophets.forEach(p => {
      const node = document.createElement('div');
      node.className = 'prophet-node' + (p.id===activeProphetId ? ' active':'');
      node.onclick = () => { activeProphetId = p.id; loadProphetStories(p.id); renderSilsila(); };
      node.innerHTML = `
        <div class="dot"></div>
        <div class="names">
          <span class="name-ar">${p.name_ar}</span>
          <span class="name-en">${p.name_en}</span>
        </div>`;
      el.appendChild(node);
    });
  }

  async function loadProphetStories(prophetId){
    const { data: stories, error } = await supabase
      .from('stories')
      .select('*')
      .eq('prophet_id', prophetId)
      .order('story_order', { ascending:true });
    if(error){ console.error('loadProphetStories error:', error); return; }
    if(!stories.length) return;
    if(stories.length === 1){
      renderStory(stories[0]);
    } else {
      renderStoryPicker(stories);
    }
  }
async function renderStory(story){
    // ...existing code stays the same...
  }
  window.renderStory = renderStory;
  function renderStoryPicker(stories){
    document.getElementById('empty-state')?.remove();
    const panel = document.getElementById('story-panel');
    const cardsHtml = stories.map(s => `
      <div class="story-card" style="margin-bottom:20px; cursor:pointer;" onclick='renderStory(${JSON.stringify(s).replace(/'/g, "&apos;")})'>
        <h2>${lang==='ar' ? s.title_ar : s.title_en}</h2>
        <span class="title-en">${lang==='ar' ? s.title_en : s.title_ar}</span>
      </div>`).join('');
    panel.innerHTML = `
      <div class="section-label">${lang==='ar' ? 'اختر القصة' : 'Choose a story'}</div>
      ${cardsHtml}`;
  }

  async function renderStory(story){
    document.getElementById('empty-state')?.remove();
    const panel = document.getElementById('story-panel');

    const { data: verses } = await supabase
      .from('story_verses')
      .select('*')
      .eq('story_id', story.id)
      .order('verse_order', { ascending:true });

    const { data: quiz } = await supabase
      .from('quiz_questions')
      .select('*')
      .eq('story_id', story.id);

    const versesHtml = (verses||[]).map(v => `
      <div class="verse">
        <span class="ref">${lang==='ar' ? v.surah_name_ar : v.surah_name_en} · ${v.ayah_ref}</span>
        <span class="ar">${v.arabic_text}</span>
        <span class="en">${v.translation_en}</span>
      </div>`).join('');

    const quizHtml = (quiz||[]).map((q, qi) => {
      const questionText = lang==='ar' ? q.question_ar : q.question_en;
      const choices = lang==='ar' ? q.choices_ar : q.choices_en;
      const choicesHtml = choices.map((c, ci) => `
        <button class="choice" data-correct="${ci===q.correct_index}" onclick="handleChoice(this, '${qi}')">${c}</button>
      `).join('');
      const explain = lang==='ar' ? q.explanation_ar : q.explanation_en;
      return `
        <div class="quiz-box">
          <div class="q">${questionText}</div>
          ${choicesHtml}
          <div class="quiz-explain" id="explain-${qi}">${explain||''}</div>
        </div>`;
    }).join('');

    panel.innerHTML = `
      <div class="story-card">
        <h2>${lang==='ar' ? story.title_ar : story.title_en}</h2>
        <span class="title-en">${lang==='ar' ? story.title_en : story.title_ar}</span>
        <p>${lang==='ar' ? story.summary_ar : story.summary_en}</p>

        ${versesHtml ? `<span class="section-label">${lang==='ar'?'الآيات':'Verses'}</span>${versesHtml}` : ''}
        ${quizHtml ? `<span class="section-label">${lang==='ar'?'اختبر نفسك':'Test yourself'}</span>${quizHtml}` : ''}
      </div>`;
  }

  window.handleChoice = function(btn, qi){
    const group = btn.parentElement;
    const buttons = group.querySelectorAll('.choice');
    buttons.forEach(b => b.disabled = true);
    buttons.forEach(b => {
      if(b.dataset.correct === 'true') b.classList.add('correct');
    });
    if(btn.dataset.correct !== 'true') btn.classList.add('wrong');
    const explain = document.getElementById(`explain-${qi}`);
    if(explain) explain.style.display = 'block';
  };

  loadProphets();
</script>
</body>
</html>
